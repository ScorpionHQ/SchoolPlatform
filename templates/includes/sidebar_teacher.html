{% load i18n %}

<aside class="sidebar">

    <div class="sidebar-header">

        <i class="bi bi-person-workspace"></i>

        <h4>{% trans "Teacher Panel" %}</h4>

        <small>{% trans "Teacher Dashboard" %}</small>

    </div>

    <div class="sidebar-menu">

        <a href="{% url 'teachers:dashboard' %}"
           class="{% if request.resolver_match.url_name == 'dashboard' and request.resolver_match.namespace == 'teachers' %}active{% endif %}">

            <i class="bi bi-grid-1x2-fill"></i>

            <span>{% trans "Dashboard" %}</span>

        </a>

        <hr>

        <a href="{% url 'teachers:my_students' %}"
           class="{% if request.resolver_match.url_name == 'my_students' %}active{% endif %}">

            <i class="bi bi-mortarboard"></i>

            <span>{% trans "My Students" %}</span>

        </a>

        <a href="{% url 'attendance:calendar' %}"
           class="{% if request.resolver_match.namespace == 'attendance' %}active{% endif %}">

            <i class="bi bi-calendar-check"></i>

            <span>{% trans "Take Attendance" %}</span>

        </a>

        <a href="{% url 'teachers:enter_grades' %}"
           class="{% if request.resolver_match.url_name == 'enter_grades' %}active{% endif %}">

            <i class="bi bi-bar-chart-fill"></i>

            <span>{% trans "Enter Grades" %}</span>

        </a>

        <hr>

        <a href="{% url 'assistant:chat' %}"
           class="{% if request.resolver_match.namespace == 'assistant' %}active{% endif %}">

            <i class="bi bi-robot"></i>

            <span>{% if LANGUAGE_CODE == 'ar' %}المساعد الذكي{% else %}AI Assistant{% endif %}</span>

        </a>

        <hr>

        <form action="{% url 'logout' %}" method="post">

            {% csrf_token %}

            <button type="submit" class="sidebar-link-btn">

                <i class="bi bi-box-arrow-right"></i>

                <span>{% trans "Logout" %}</span>

            </button>

        </form>

    </div>

</aside>
