{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}"
      dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="manifest" href="{% static 'pwa/manifest.webmanifest' %}?v=6">
    <link rel="icon" href="{% static 'favicon.ico' %}?v=4" sizes="32x32">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{% static 'pwa/apple-touch-icon.png' %}?v=4">

    <script>
        (function(){
            var t=localStorage.getItem("theme");
            var d=t? t==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute("data-theme", d?"dark":"light");
            document.documentElement.setAttribute("data-bs-theme", d?"dark":"light");
        })();
    </script>

    <title>
        {% block title %}
        {% trans "School Platform" %}
        {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/variables.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'css/components.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=15">
    <link rel="stylesheet" href="{% static 'css/typography.css' %}?v=15">

    {% if LANGUAGE_BIDI %}
    <link rel="stylesheet" href="{% static 'css/rtl.css' %}?v=15">
    {% endif %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/dark.css' %}?v=15">

    <link rel="stylesheet" href="{% static 'css/mobile.css' %}?v=9">

    {% if LANGUAGE_BIDI %}
    <style>
        body{
            direction:rtl;
            text-align:right;
            font-family:"Cairo",sans-serif;
        }
    </style>
    {% else %}
    <style>
        body{
            direction:ltr;
            text-align:left;
        }
    </style>
    {% endif %}

</head>

<body class="bg-light">

<div class="position-fixed top-0 start-0 m-3 z-3">

    <button
        type="button"
        class="btn btn-light rounded-circle shadow theme-toggle"
        aria-label="Toggle theme"
        title="{% trans 'Toggle theme' %}">

        <i class="bi bi-moon-stars-fill theme-icon"></i>

    </button>

</div>

<div class="container">

    <div class="row justify-content-center align-items-center auth-center">

        {% include "includes/messages.html" %}

        {% block content %}
        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/theme.js' %}?v=5"></script>
    <script src="{% static 'js/pwa.js' %}?v=5"></script>

</body>

</html>
