{% extends "base.html" %}
{% load i18n %}

{% block title %}
{% trans "Teacher" %}
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header">

        <h4 class="mb-0">

            {% if form.instance.pk %}
                {% trans "Edit Teacher" %}
            {% else %}
                {% trans "Add Teacher" %}
            {% endif %}

        </h4>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="mt-3">

                <button type="submit" class="btn btn-primary">

                    <i class="bi bi-check-lg"></i>

                    {% trans "Save" %}

                </button>

                <a href="{% url 'teachers:list' %}" class="btn btn-secondary">

                    {% trans "Cancel" %}

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
