{% extends "base.html" %}
{% load i18n %}

{% block title %}
{% trans "Delete Student" %}
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-danger text-white">

        <h4 class="mb-0">
            {% trans "Delete Student" %}
        </h4>

    </div>

    <div class="card-body">

        <p>

            {% trans "Are you sure you want to delete" %}

            <strong>

                {{ student.user.get_full_name }}

            </strong>

            ?

        </p>

        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger">

                <i class="bi bi-trash"></i>

                {% trans "Delete" %}

            </button>

            <a
                href="{% url 'students:list' %}"
                class="btn btn-secondary">

                {% trans "Cancel" %}

            </a>

        </form>

    </div>

</div>

{% endblock %}
