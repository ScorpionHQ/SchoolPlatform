{% extends "auth_base.html" %}
{% load i18n %}

{% block title %}
{% trans "Login" %}
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header text-center">

                <h3>

                    {% trans "SchoolPlatform" %}

                </h3>

                <p class="text-muted mb-0">

                    {% trans "Sign in to your account" %}

                </p>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                            {% trans "Login Code" %}

                        </label>

                        <input
                            type="text"
                            name="login_code"
                            class="form-control"
                            placeholder="STU000001">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            {% trans "Password" %}

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control">

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        {% trans "Login" %}

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
