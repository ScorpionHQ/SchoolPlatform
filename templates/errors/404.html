{% extends "base.html" %}
{% load i18n %}

{% block title %}
404
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm border-0">

        <div class="card-body text-center p-5">

            <h1 class="display-1 text-warning">
                🔍
            </h1>

            <h2 class="fw-bold mb-3">
                {% trans "Page not found" %}
            </h2>

            <p class="text-muted mb-4">
                {% trans "The page you are looking for does not exist." %}
            </p>

            <a href="{% url 'dashboard' %}" class="btn btn-primary">
                {% trans "Back to Dashboard" %}
            </a>

            <button type="button"
                    class="btn btn-outline-primary"
                    onclick="window.AssistantApp && window.AssistantApp.send('{% if LANGUAGE_CODE == 'ar' %}واجهت خطأ 404 (صفحة غير موجودة). ساعدني ماذا أفعل؟{% else %}I got a 404 error (page not found). Help me what to do?{% endif %}')">

                <i class="bi bi-robot"></i>
                {% trans "Ask the assistant" %}

            </button>

        </div>

    </div>

</div>

<script>
    window.assistantError = "404";
</script>

{% endblock %}
