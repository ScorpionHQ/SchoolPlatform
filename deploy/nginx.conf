# ==========================================================
#  SchoolPlatform - إعداد nginx (كوكيل عكسي + SSL)
#  انسخه إلى:  /etc/nginx/sites-available/schoolplatform
#  ثم أنشئ رابطاً في sites-enabled
#  استبدل __DOMAIN__ باسم النطاق الفعلي (يتم تلقائياً عبر deploy.sh)
# ==========================================================

upstream schoolplatform {
    server 127.0.0.1:8000;
}

# --- إعادة توجيه HTTP إلى HTTPS ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # تحويل دائم إلى HTTPS
    return 301 https://$host$request_uri;
}

# --- HTTPS (النطاق الرئيسي) -------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # شهادات Let's Encrypt (بعد تشغيل certbot)
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- ترويسات أمان إضافية ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- حدود حجم الطلبات (رفع ملفات Excel / الصور) ---
    client_max_body_size 20m;

    # --- الملفات الثابتة (static) ---
    location /static/ {
        alias /opt/schoolplatform/staticfiles/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        gzip_static on;
    }

    # --- الملفات المرفوعة (media) ---
    location /media/ {
        alias /opt/schoolplatform/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # --- خدمة الـ Worker (PWA): لا تُخزَّن مؤقتاً أبداً ---
    # الترويسات يضيفها Django نفسه (Service-Worker-Allowed / no-cache)
    location = /service-worker.js {
        proxy_pass http://schoolplatform;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- كل ما تبقى يُمرَّر إلى gunicorn ---
    location / {
        proxy_pass http://schoolplatform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
